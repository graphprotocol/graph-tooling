specVersion: 0.0.5
repository: https://github.com/graphprotocol/test-subgraph
description: Test subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ExampleSubgraph
    network: 11155111
    source:
      abi: ExampleContract
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./mapping.ts
      entities:
        - ExampleEntity
      abis:
        - name: ExampleContract
          file: ./Abi.json
      eventHandlers:
        - event: ExampleEvent(string)
          handler: handleExampleEvent
templates:
  - kind: file/ipfs
    name: IpfsContent
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./mapping.ts
      entities:
        - ExampleEntity
      abis:
        - name: ExampleContract
          file: ./Abi.json
      handler: handleIpfsContent
